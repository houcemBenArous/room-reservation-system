<div class="min-h-screen flex items-center justify-center bg-gray-100 hero-pattern">
  <div class="max-w-md w-full bg-white rounded-xl shadow-2xl overflow-hidden p-8 space-y-8">
    
    <div class="text-center">
      <h2 class="text-3xl font-extrabold text-gray-900 tracking-tight">
        Bienvenue
      </h2>
      <p class="mt-2 text-sm text-gray-600">
        Connectez-vous pour accéder à l'assistant de réservation
      </p>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="mt-8 space-y-6">
      <div class="rounded-md shadow-sm -space-y-px">
        <div class="mb-4">
          <label for="username" class="sr-only">Nom d'utilisateur</label>
          <input id="username" type="text" formControlName="username" required
            class="appearance-none relative block w-full px-3 py-3 border border-gray-300 placeholder-gray-500 text-gray-900 rounded-lg focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 focus:z-10 sm:text-sm"
            placeholder="Nom d'utilisateur">
        </div>
        <div>
          <label for="password" class="sr-only">Mot de passe</label>
          <input id="password" type="password" formControlName="password" required
            class="appearance-none relative block w-full px-3 py-3 border border-gray-300 placeholder-gray-500 text-gray-900 rounded-lg focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 focus:z-10 sm:text-sm"
            placeholder="Mot de passe">
        </div>
      </div>

      <div *ngIf="error" class="text-red-500 text-sm text-center font-medium bg-red-50 p-2 rounded">
        {{ error }}
      </div>

      <div>
        <button type="submit" [disabled]="loginForm.invalid || isLoading"
          class="group relative w-full flex justify-center py-3 px-4 border border-transparent text-sm font-medium rounded-lg text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 disabled:opacity-50 transition-all duration-200 shadow-md hover:shadow-lg">
          <span *ngIf="!isLoading">Se connecter</span>
          <span *ngIf="isLoading" class="flex items-center">
             <svg class="animate-spin -ml-1 mr-3 h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
               <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
               <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
             </svg>
             Chargement...
          </span>
        </button>
      </div>
    </form>
  </div>
</div>
