spring.application.name=agent-service
server.port=8081

# Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# Ollama Configuration
spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.chat.options.model=llama3.1
spring.ai.ollama.chat.options.temperature=0.7

# MCP Client - Room Service
spring.ai.mcp.client.streamable-http.connections.room-service.url=http://localhost:9091/mcp

# MCP Client - Reservation Service
spring.ai.mcp.client.streamable-http.connections.reservation-service.url=http://localhost:9092/mcp