spring.application.name=reservation-service
server.port=9092

# MySQL Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/reservation-db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root123*
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# MCP Server Configuration
spring.ai.mcp.server.protocol=streamable

# Resilience4j Circuit Breaker Configuration
resilience4j.circuitbreaker.instances.roomService.sliding-window-size=10
resilience4j.circuitbreaker.instances.roomService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.roomService.wait-duration-in-open-state=10000
resilience4j.circuitbreaker.instances.roomService.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.roomService.automatic-transition-from-open-to-half-open-enabled=true

# Feign Configuration
feign.client.config.default.connect-timeout=5000
feign.client.config.default.read-timeout=5000

# JSON
