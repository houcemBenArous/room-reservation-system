# ============================================
# APPLICATION CONFIGURATION
# ============================================
spring.application.name=api-gateway
server.port=8888

# ============================================
# EUREKA DISCOVERY CLIENT
# ============================================
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

# ============================================
# JWT CONFIGURATION
# ============================================
jwt.secret=dGhpc19pc19hX3Zlcnlfc2VjdXJlX2tleV9mb3Jfand0X3Rva2VuX2dlbmVyYXRpb25fMTIzNDU2Nzg5MA==

# ============================================
# CORS CONFIGURATION (Pour Angular)
# ============================================
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-origins=http://localhost:4200
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-headers=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allow-credentials=true
spring.cloud.gateway.globalcors.cors-configurations.[/**].max-age=3600

# ============================================
# GATEWAY TIMEOUT CONFIGURATION
# ============================================
spring.cloud.gateway.httpclient.connect-timeout=10000
spring.cloud.gateway.httpclient.response-timeout=60s
spring.cloud.gateway.httpclient.pool.max-idle-time=30s

# ============================================
# DISCOVERY LOCATOR (Désactivé car on utilise routes explicites)
# ============================================
spring.cloud.gateway.discovery.locator.enabled=false
spring.cloud.gateway.discovery.locator.lower-case-service-id=true

# ============================================
# LOGGING (Optionnel - pour debug)
# ============================================
logging.level.org.springframework.cloud.gateway=DEBUG
logging.level.reactor.netty.http.client=DEBUG